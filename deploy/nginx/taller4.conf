# =============================================================================
#  Taller 4 · «Entidades seguras en un mundo digital»
#  Configuración de nginx para el proxy inverso de la app.
#
#  Requisitos del documento de preparación (apartado 6):
#    «No guardar direcciones IP ni identificadores de dispositivo (configurar
#     servidor y alojamiento para no registrarlos o anonimizarlos de
#     inmediato); una IP puede ser dato personal (TJUE C-582/14, Breyer).»
#
#  Por eso este fichero:
#    1. NO registra el acceso en el log de nginx (access_log off).
#    2. NO reenvía la IP del visitante a la app (X-Forwarded-For y X-Real-IP
#       se vacían a propósito: la app nunca llega a ver la dirección).
#    3. Deja el log de errores con un formato que tampoco incluye la IP.
#
#  Sustituye los dos valores marcados con «CAMBIAR» por los del dominio real.
# =============================================================================

# -----------------------------------------------------------------------------
# Formato de log de errores sin dirección IP ni identificador de petición.
# Se usa «$uri» (la ruta) y no «$request» (que incluye la IP).
# -----------------------------------------------------------------------------
log_format taller4_sin_ip '$remote_addr $host $uri $status $body_bytes_sent';


# -----------------------------------------------------------------------------
# HTTP: solo redirige a HTTPS.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name taller4.example.org;   # CAMBIAR

    # Let's Encrypt necesita poder responder en el reto HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# -----------------------------------------------------------------------------
# HTTPS: la app.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taller4.example.org;   # CAMBIAR

    # ---------------------------------------------------------------------
    # Certificado (las rutas las genera certbot).
    # ---------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/taller4.example.org/fullchain.pem;  # CAMBIAR
    ssl_certificate_key /etc/letsencrypt/live/taller4.example.org/privkey.pem;    # CAMBIAR

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------------------------------------------------------------------
    # Registro de accesos: DESACTIVADO.
    # Es el punto más importante de este fichero. Sin esta línea, nginx
    # guardaría en /var/log/nginx/access.log la dirección IP de cada
    # participante durante los 90 minutos del taller.
    # ---------------------------------------------------------------------
    access_log off;

    # El log de errores tampoco debe incluir la IP.
    error_log /var/log/nginx/taller4-error.log taller4_sin_ip warn;

    # ---------------------------------------------------------------------
    # Cabeceras de seguridad (la app ya envía las suyas; aquí se refuerza
    # lo que depende del proxy).
    # ---------------------------------------------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---------------------------------------------------------------------
    # Límites: las respuestas de la app son pequeñas. Un límite bajo evita
    # que alguien use el servidor para subir ficheros.
    # ---------------------------------------------------------------------
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ---------------------------------------------------------------------
    # Compresión. Sin CDN ni recursos de terceros: todo se sirve desde el
    # servidor propio.
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ---------------------------------------------------------------------
    # Proxy inverso hacia la app.
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Host real: lo necesita la app para construir las URL del QR y de
        # los enlaces (por ejemplo, la hoja imprimible).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         "";
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Se vacían también las cabeceras estándar de proxys para que la
        # IP no llegue por ningún camino.
        proxy_set_header Forwarded          "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # El panel se actualiza en directo: sin almacenamiento en búfer para
        # que los resultados lleguen al proyector sin retardo.
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------------------------------------------------------------------
    # El panel de dinamización no se indexa nunca.
    # ---------------------------------------------------------------------
    location = /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
